# Cloudflare Workers static assets configuration.

name = "authrim-sveltekit-example"
compatibility_date = "2024-01-01"
main = ".svelte-kit/cloudflare/_worker.js"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Environment variables (set these in Cloudflare Dashboard for production)
# [vars]
# PUBLIC_AUTHRIM_ISSUER = "https://your-tenant.authrim.com"
# PUBLIC_AUTHRIM_CLIENT_ID = "your-client-id"
